name: tests

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra edge --extra dev

      - name: Binding quality gate (make verify)
        run: uv run make verify

